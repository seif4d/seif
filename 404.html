<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0c0d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, follow">
  <title>404 — Dimension Not Found | SEIF4D</title>
  <style>
    :root {
      --lime: #c8ff35;
      --black: #0a0c0d;
      --paper: #f3f2ed;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--black);
      color: var(--paper);
      font-family: var(--sans);
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 255, 53, 0.1), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      font: 700 0.72rem var(--mono);
      letter-spacing: 0.15em;
      color: var(--lime);
      padding: 6px 14px;
      border: 1px solid rgba(200, 255, 53, 0.3);
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(6rem, 22vw, 13rem);
      margin: 0;
      line-height: 0.85;
      letter-spacing: -0.08em;
      font-weight: 900;
      color: #fff;
    }
    h1 span { color: var(--lime); }
    p {
      color: #9aa1a4;
      max-width: 440px;
      margin: 18px auto 0;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--lime);
      color: #080808;
      padding: 13px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 750;
      font-size: 0.88rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(200, 255, 53, 0.3);
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">ERROR 404 / DIMENSION NOT FOUND</div>
    <h1>40<span>4</span></h1>
    <p>This dimension doesn’t exist or has moved. Let’s bring you back to reality.<br><span style="font-size:0.9rem;color:#6b7274;">هذا المسار غير موجود. لنعد إلى الصفحة الرئيسية.</span></p>
    <div class="actions">
      <a href="./index.html">Return to SEIF4D <span>→</span></a>
    </div>
  </main>
</body>
</html>
